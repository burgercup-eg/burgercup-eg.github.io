<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كاشير برجر كب</title><style>html, body, #root { margin: 0; min-height: 100%; }
body { background: #12201f; }
.cash-bg { font-family: system-ui, "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif; position: relative; min-height: 100vh; overflow: hidden; color: #f7f2ea; font-size: 16px; line-height: 1.4;
    background-color: #12201f; background-size: cover; background-position: center top; background-attachment: scroll; }
.cash-glow { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .35; pointer-events: none; }
.cash-glow-a { width: 340px; height: 340px; background: #2f6f66; top: -80px; inset-inline-start: -80px; animation: cash-drift-a 22s ease-in-out infinite alternate; }
.cash-glow-b { width: 300px; height: 300px; background: #8a5a2b; bottom: 10%; inset-inline-end: -90px; opacity: .22; animation: cash-drift-b 28s ease-in-out infinite alternate; }
@keyframes cash-drift-a { to { transform: translate(120px, 160px) scale(1.2); } }
@keyframes cash-drift-b { to { transform: translate(-100px, -180px) scale(1.15); } }
.cash-app { position: relative; max-width: 640px; margin: 0 auto; padding: 16px 14px 40px; }
.cash-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.cash-brand { font-size: 26px; font-weight: 700; color: #ffb35c; letter-spacing: 0; }
.cash-sub { font-size: 13px; color: #cfd8d4; }
.cash-sub2 { color: #cfd8d4; font-size: 13px; margin: 4px 0 0; }
.cash-tabs2 { display: flex; background: rgba(0,0,0,.28); border-radius: 14px; padding: 4px; gap: 4px; }
.cash-tabs2 button { min-height: 44px; min-width: 0; padding: 0 10px; font-size: 14px; border: 0; border-radius: 10px; background: transparent; color: #e8e2d8; font: inherit; font-weight: 600; }
.cash-tabs2 button.is-on { background: #f7f2ea; color: #14201f; }
.cash-note { background: rgba(0,0,0,.3); padding: 8px 12px; border-radius: 10px; font-size: 13px; }
.cash-order, .cash-sales { background: rgba(10,22,21,.72); border: 1px solid rgba(255,255,255,.12); border-radius: 18px; padding: 14px; backdrop-filter: blur(6px); }
.cash-total-row, .cash-big { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.cash-label { font-size: 13px; color: #cfd8d4; }
.cash-total { font-size: 38px; font-weight: 700; color: #ffd08a; line-height: 1.1; animation: cash-bump .25s ease; }
.cash-total span { font-size: 16px; color: #e8e2d8; font-weight: 500; }
@keyframes cash-bump { from { transform: scale(1.08); } to { transform: scale(1); } }
.cash-actions { display: flex; flex-direction: column; gap: 8px; }
.cash-done { min-height: 52px; padding: 0 22px; border: 0; border-radius: 14px; background: #3fa58f; color: #06201b; font: inherit; font-size: 18px; font-weight: 700; }
.cash-done:disabled { background: #3a4a47; color: #8d9a96; }
.cash-clear, .cash-danger { min-height: 46px; padding: 0 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,.3); background: transparent; color: #f7f2ea; font: inherit; font-weight: 600; }
.cash-clear:disabled { opacity: .4; }
.cash-danger { background: #c4453d; border-color: #c4453d; color: #fff; }
.cash-empty { color: #cfd8d4; margin: 12px 0 2px; }
.cash-lines { list-style: none; margin: 10px 0 0; padding: 0; }
.cash-lines li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid rgba(255,255,255,.1); }
.cash-ln { flex: 1; font-weight: 600; }
.cash-lp { color: #ffd08a; font-weight: 600; min-width: 48px; text-align: end; }
.cash-qty { display: flex; align-items: center; gap: 4px; direction: ltr; }
.cash-qty b { min-width: 28px; text-align: center; font-size: 18px; }
.cash-qty button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08); color: #f7f2ea; font-size: 22px; }
.cash-cats { display: flex; gap: 8px; overflow-x: auto; padding: 14px 0 10px; scrollbar-width: none; }
.cash-cats button { flex: 0 0 auto; min-height: 46px; padding: 0 18px; border-radius: 23px; border: 1px solid rgba(255,255,255,.25); background: rgba(10,22,21,.6); color: #f7f2ea; font: inherit; font-weight: 600; }
.cash-cats button.is-on { background: #ffb35c; border-color: #ffb35c; color: #1d1409; }
.cash-grid { display: grid; gap: 10px; }
.cash-item { background: rgba(10,22,21,.72); border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 12px 14px; }
.cash-iname { font-size: 19px; font-weight: 700; margin-bottom: 10px; }
.cash-vars { display: flex; gap: 8px; flex-wrap: wrap; }
.cash-var { position: relative; flex: 1 1 90px; min-height: 64px; border-radius: 14px; border: 1px solid rgba(255,255,255,.28); background: #26403c; color: #f7f2ea; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: transform .12s; }
.cash-var:active { transform: scale(.96); }
.cash-var.is-sel { border-color: #ffb35c; background: #35504a; }
.cash-var.is-pop { animation: cash-pop .26s ease; }
@keyframes cash-pop { 50% { transform: scale(1.07); } }
.cash-vl { font-size: 14px; color: #ffd08a; font-weight: 700; }
.cash-vp { font-size: 22px; font-weight: 700; }
.cash-badge { position: absolute; top: -8px; inset-inline-start: -6px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; background: #ffb35c; color: #1d1409; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.cash-legend { color: #cfd8d4; font-size: 13px; margin: 10px 2px 0; }
.cash-sales h2 { font-size: 17px; margin: 18px 0 0; color: #ffd08a; }
.cash-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
@media (prefers-reduced-motion: reduce) { .cash-glow, .cash-total, .cash-var { animation: none !important; } }

.cash-item { display: flex; gap: 12px; align-items: flex-start; }
.cash-main { flex: 1; min-width: 0; }
.cash-ph { width: 76px; height: 76px; border-radius: 14px; object-fit: cover; flex: 0 0 auto; background: #12201f; }
.cash-vl small { font-size: 11px; font-weight: 500; color: #e8e2d8; margin-inline-start: 4px; }
.cash-var { flex: 1 1 70px; }

.cash-badge { top: auto !important; bottom: 3px !important; inset-inline-start: 4px !important; min-width: 20px !important; height: 20px !important; font-size: 12px !important; }
.cash-vars .cash-var:only-child { flex: 0 0 150px; }
.cash-lines li.cash-li { display: block; }
.cash-l1 { display: flex; align-items: center; gap: 10px; }
.cash-cm { display: block; font-style: normal; font-size: 13px; font-weight: 500; color: #ffd08a; margin-top: 2px; }
.cash-cbtn { margin-top: 4px; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px dashed rgba(255,255,255,.35); background: transparent; color: #e8e2d8; font: inherit; font-size: 14px; }
.cash-ed { margin-top: 8px; padding: 10px; border-radius: 12px; background: rgba(255,255,255,.06); }
.cash-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.cash-chips button { min-height: 40px; padding: 0 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,.3); background: rgba(10,22,21,.6); color: #f7f2ea; font: inherit; font-size: 14px; }
.cash-chips button.is-on { background: #ffb35c; border-color: #ffb35c; color: #1d1409; font-weight: 700; }
.cash-note-row { display: flex; gap: 8px; margin-top: 8px; }
.cash-note-row input { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid rgba(255,255,255,.3); background: rgba(10,22,21,.8); color: #f7f2ea; padding: 0 12px; font: inherit; font-size: 16px; }
.cash-okb { min-height: 44px; padding: 0 18px; border: 0; border-radius: 10px; background: #3fa58f; color: #06201b; font: inherit; font-weight: 700; }
.cash-ol { margin-top: 4px; font-size: 14px; color: #e8e2d8; }

.cash-chips button.is-spec { border-color: #3fa58f; background: rgba(63,165,143,.22); }
.cash-chips button.is-spec.is-on, .cash-chips button.is-on { background: #ffb35c; border-color: #ffb35c; color: #1d1409; }

.cash-delb { margin-top: 10px; min-height: 48px; width: 100%; border-radius: 12px; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.06); color: #f7f2ea; font: inherit; font-weight: 700; }
.cash-delb.is-on { background: #ffb35c; border-color: #ffb35c; color: #1d1409; }
.cash-delf { display: grid; gap: 8px; margin-top: 8px; }
.cash-delf input { min-height: 46px; border-radius: 10px; border: 1px solid rgba(255,255,255,.3); background: rgba(10,22,21,.8); color: #f7f2ea; padding: 0 12px; font: inherit; font-size: 16px; width: 100%; box-sizing: border-box; }
.cash-feel { display: grid; gap: 4px; font-size: 13px; color: #cfd8d4; }
.cash-warn { color: #ff9c8f; margin: 0; font-size: 14px; }
.cash-inv { background: #fffdf8; color: #1b1b1b; border-radius: 12px; padding: 16px; margin-top: 12px; }
.inv-h { text-align: center; border-bottom: 2px dashed #999; padding-bottom: 10px; }
.inv-brand { font-size: 26px; font-weight: 800; color: #b3541e; }
.inv-t { font-size: 18px; font-weight: 700; margin-top: 2px; }
.inv-s { font-size: 12px; color: #444; margin-top: 4px; }
.inv-meta { display: flex; justify-content: space-between; font-size: 14px; margin: 10px 0; color: #333; }
.inv-cust { font-size: 15px; line-height: 1.7; padding: 8px 0; border-bottom: 1px dashed #999; }
.inv-tb { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 15px; }
.inv-tb th { text-align: start; border-bottom: 1px solid #333; padding: 4px 2px; }
.inv-tb td { padding: 6px 2px; border-bottom: 1px dotted #bbb; vertical-align: top; }
.inv-tb th:nth-child(n+2), .inv-tb td:nth-child(n+2) { text-align: center; width: 52px; }
.inv-c { font-size: 12px; color: #7a3b12; }
.inv-sum { margin-top: 8px; font-size: 15px; }
.inv-sum div { display: flex; justify-content: space-between; padding: 3px 0; }
.inv-tot { font-weight: 800; font-size: 19px; border-top: 2px solid #333; margin-top: 4px; padding-top: 6px !important; }
@page { margin: 3mm; }
@media print {
 .cash-noprint, .cash-glow { display: none !important; }
 html, body, .cash-bg { background: #fff !important; background-image: none !important; min-height: 0 !important; }
 .cash-app { padding: 0 !important; max-width: none !important; width: 100% !important; }
 .cash-inv { margin: 0 auto !important; border-radius: 0 !important; box-shadow: none !important; width: 100% !important; max-width: 100% !important; color: #000 !important; background: #fff !important; padding: 0 !important; font-size: 12px; }
 .cash-inv * { color: #000 !important; border-color: #000 !important; }
 .inv-tb td, .inv-tb th { padding: 2px 3px; }
 .inv-tot { font-size: 15px; }
 .cash-inv { break-inside: avoid; }
}

.cash-ord .cash-ohd{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 0;border:0;background:transparent;color:inherit;font:inherit;text-align:right;cursor:pointer}
.cash-onum{font-weight:800;color:#ffb35c;min-width:58px}.cash-ot{flex:1;font-size:14px}.cash-chev{color:#ffb35c}
.cash-odt{padding:2px 0 8px;border-top:1px dashed rgba(255,255,255,.18)}
.cash-best li{align-items:flex-start}.cash-rk{min-width:30px;height:30px;border-radius:50%;background:#ffb35c;color:#1b1206;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px}
.cash-bm{flex:1}.cash-bar{height:8px;border-radius:6px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}.cash-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#3fa58d,#ffb35c)}

.cash-seg{display:flex;gap:8px;margin-top:10px}.cash-seg button{flex:1;min-height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#f7f2ea;font:inherit;font-weight:700}.cash-seg button.is-on{background:#ffb35c;color:#1b1206;border-color:#ffb35c}
.cash-flt{display:flex;gap:8px;margin:8px 0}.cash-flt button{flex:1;min-height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#f7f2ea;font:inherit;font-size:14px}.cash-flt button.is-on{background:#3fa58d;border-color:#3fa58d;color:#fff;font-weight:700}
.cash-ty{font-style:normal;font-size:12px;padding:1px 8px;border-radius:10px;margin-right:4px;background:rgba(255,255,255,.14)}.cash-ty.d{background:rgba(255,179,92,.25);color:#ffcf99}
.cash-types{display:flex;gap:8px;margin:10px 0}.cash-types>div{flex:1;border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:2px;font-size:14px}.cash-types span{color:#ffb35c;font-weight:700}
.cash-editbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(240,180,80,.18);border:1px solid #f0b450;border-radius:12px;padding:8px 12px;margin-bottom:10px;color:#ffd58a;font-weight:700}.cash-editbar button{margin:0}
.cash-inv{position:relative;isolation:isolate;overflow:hidden}.inv-wm{position:absolute;z-index:-1;left:50%;top:50%;width:55%;max-width:200px;transform:translate(-50%,-50%);opacity:.12;pointer-events:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cash-szh{color:#e8e2d8;font-size:14px;margin:4px 0 6px}.cash-sz{display:flex;gap:8px;margin-bottom:12px}.cash-sz div{flex:1;border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;gap:2px;font-size:13px}.cash-sz div span{color:#e8e2d8}.cash-sz div b{font-weight:700}.cash-sz div.top{border:2px solid #ffb35c;background:rgba(255,179,92,.16)}.cash-sz div em{font-style:normal;font-size:12px;color:#ffb35c;font-weight:800}.cash-zs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:13px}.cash-zs span{padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.1)}.cash-zs span.top{background:#ffb35c;color:#1b1206;font-weight:800}
.cash-rep pre{white-space:pre-wrap;word-break:break-word;background:rgba(0,0,0,.35);border-radius:12px;padding:10px;font:inherit;font-size:13px;line-height:1.6;max-height:360px;overflow:auto;direction:rtl;text-align:right}

.cash-void .cash-ohd{opacity:.6}.cash-void .cash-lp{text-decoration:line-through}.cash-vtag{color:#ff8a80;font-weight:700;margin-inline-start:6px}
.cash-bkw{background:rgba(255,193,7,.14);border:1px solid rgba(255,193,7,.55);color:#ffe082;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px;line-height:1.6}
.cash-bkw button{margin-top:6px}

.cash-delf select{width:100%;min-height:48px;font:inherit;color:inherit;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:0 10px}
.cash-delf select option,.cash-delf select optgroup{background:#12201f;color:#fff}
.cash-cust{color:#9be7a6;font-size:14px;margin:4px 0}
.cash-newa{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.cash-newa input{flex:1;min-width:120px}

.cash-rdr{width:100%;display:block;background:transparent;border:0;color:inherit;font:inherit;text-align:right;padding:8px 0;cursor:pointer;min-height:44px}
.cash-rdl{margin:2px 0 8px;padding:8px 10px;background:rgba(255,255,255,.06);border-radius:10px}
.cash-rdl div{display:flex;gap:10px;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:15px}
.cash-rdl div:last-child{border-bottom:0;font-weight:700}

.cash-arow{display:flex;gap:6px;align-items:center;margin:4px 0}.cash-arow input{flex:1;min-width:0}.cash-arow button{white-space:nowrap;min-height:44px;padding:0 10px}
.cash-ah{margin:8px 0 2px;color:#ffd180;font-weight:700}

.cash-afee{flex:0 0 76px;width:76px;text-align:center}

.inv-no{display:table;text-align:center;font-size:16px;font-weight:800;margin:5px auto;padding:1px 16px;border:1.5px solid #000}
.inv-dt{text-align:center;margin:4px 0}
.inv-lab{text-align:center;font-weight:800;border:1px solid #000;margin:4px 0;padding:1px}
.inv-cut{text-align:center;color:#777;margin:12px 0;border-top:2px dashed #999;padding-top:4px;font-size:12px}
.cash-rdo input{flex:1;min-width:0;margin-inline-start:6px}.cash-rdo{display:flex;align-items:center;gap:6px}
.cash-rdo{margin:8px 0;color:#e8f1ee}.cash-rdo input{background:#0f1d1a;color:#fff;border:1px solid #4a6a62;border-radius:12px;padding:10px 12px;min-height:44px;font:inherit;box-sizing:border-box}

.cash-item{position:relative}
.cash-dots{position:absolute;top:4px;left:4px;width:30px;height:30px;border:0;background:transparent;color:#f7f2ea;opacity:.38;font-size:20px;line-height:1;border-radius:8px;cursor:pointer;padding:0}
.cash-dots:active,.cash-dots.is-on{opacity:.9;background:rgba(255,255,255,.1)}
.cash-pe{margin-top:10px;padding:10px;border:1px dashed rgba(247,242,234,.3);border-radius:12px;background:rgba(0,0,0,.25)}
.cash-pe label{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:700}
.cash-pe label span{min-width:70px}
.cash-pe input{width:90px;font-size:18px;padding:6px 8px;border-radius:8px;border:1px solid rgba(247,242,234,.35);background:#0d1716;color:#f7f2ea;text-align:center}
.cash-pe .cash-row{display:flex;gap:8px;flex-wrap:wrap}
.cash-pe small{display:block;opacity:.7;margin-top:8px;font-size:12px}
.cash-pe em{font-style:normal;opacity:.6;font-size:13px}

.cash-split{display:flex;gap:10px;margin:2px 0 12px}
.cash-half{flex:1 1 0;min-width:0;border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:10px;background:rgba(0,0,0,.22);display:flex;flex-direction:column;gap:6px}
.cash-hcap{font-size:12px;color:#ffb35c;font-weight:700}
.cash-st{display:flex;align-items:baseline;justify-content:space-between;gap:6px;border-top:1px solid rgba(255,255,255,.1);padding-top:5px}
.cash-st:first-of-type{border-top:0;padding-top:0}
.cash-st span{font-size:12.5px;color:#cfd8d4}
.cash-st b{font-size:22px;font-weight:700;color:#f7f2ea;line-height:1.1}
.cash-hm{justify-content:center;align-items:center;text-align:center;gap:5px}
.cash-hlock{width:46px;height:46px;border-radius:50%;background:rgba(255,179,92,.14);display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;margin:2px 0}
.cash-hlbl{font-size:12.5px;color:#cfd8d4;line-height:1.35}
.cash-hval{font-size:27px;font-weight:700;color:#ffd08a;line-height:1.1}
.cash-hval span{font-size:13px;color:#e8e2d8;font-weight:500}
.cash-hval.sm{font-size:20px}
.cash-hbtn{min-height:42px;padding:0 12px;border-radius:11px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.07);color:#f7f2ea;font:inherit;font-size:14px;font-weight:600}
.cash-hbtn.go{background:#3fa58f;border-color:#3fa58f;color:#06201b;font-weight:700}
.cash-hbtns{display:flex;gap:6px;width:100%;margin-top:4px}
.cash-hbtns .cash-hbtn{flex:1 1 0;padding:0 4px;font-size:12.5px}
.cash-hm>.cash-hbtn{width:100%;margin-top:2px}
.cash-hnote{font-size:11.5px;color:#9fb0ab;line-height:1.35}
.cash-mny{font-style:normal}
.cash-sales.money-off .cash-mny{filter:blur(7px);user-select:none}
.cash-pinwrap{position:fixed;inset:0;z-index:60;background:rgba(4,10,9,.74);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px}
.cash-pinbox{width:100%;max-width:330px;background:#152623;border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.cash-pint{font-size:18px;font-weight:700;color:#ffd08a}
.cash-pinsub{font-size:12.5px;color:#cfd8d4;line-height:1.45}
.cash-pinin{min-height:52px;border-radius:12px;border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.35);color:#fff;font:inherit;font-size:22px;letter-spacing:6px;text-align:center;direction:ltr;padding:0 12px;width:100%;box-sizing:border-box}
.cash-pinmsg{font-size:13px;color:#ff9b93;min-height:18px}
.cash-pinbtns{display:flex;gap:8px}
.cash-pinbtns .cash-hbtn{flex:1;min-height:48px;font-size:15px}

function invHtml(o,idx,lab){const d=o.d||{name:'',phone:'',addr:'',note:'',rd:'',fee:0,sub:o.total},dt=new Date(o.t),isD=!!o.d;
 return `<div class="cash-inv"><img class="inv-wm" alt="" src="${LOGO}"><div class="inv-h"><div class="inv-brand" dir="ltr">Burger Cup</div><div class="inv-t">${isD?'فاتورة دليفري':'فاتورة تيك أواي'}</div>${lab?`<div class="inv-lab">${lab}</div>`:''}<div class="inv-s">كفر الشيخ - أمام كلية تجارة · 01034674404 - 01034669824</div></div>
 <div class="inv-no">رقم ${NO(o,idx)}</div><div class="inv-dt">${dmy(o.t)} · ${hhmm(o.t)}</div>
 ${isD?`<div class="inv-cust">${d.name?`<div><b>الاسم:</b> ${esc(d.name)}</div>`:''}<div><b>التليفون:</b> <bdi>${esc(d.phone)}</bdi></div><div><b>العنوان:</b> ${d.area?esc(d.area)+' - ':''}${esc(d.addr)}</div>${d.note?`<div><b>ملاحظات:</b> ${esc(d.note)}</div>`:''}${d.rd?`<div><b>الطيار:</b> ${esc(d.rd)}</div>`:''}</div>`:''}
 <table class="inv-tb"><tr><th>الصنف</th><th>عدد</th><th>سعر</th></tr>`+o.l.map(x=>`<tr><td>${esc(LOOK[x.k].name)}${cmt(x)?`<div class="inv-c">${esc(cmt(x))}</div>`:''}</td><td>${x.q}</td><td>${n(lineP(x)*x.q)}</td></tr>`).join('')+`</table>
