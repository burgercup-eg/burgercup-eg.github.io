name: fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in [1-7]-*; do if [ -e "$f" ]; then mv -f "$f" "${f#?-}"; fi; done
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m rename-files
          git push || true
